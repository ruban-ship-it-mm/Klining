<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- Библиотека Supabase одним файлом -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Шрифты грузятся в фоне и не задерживают показ страницы -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<style>
  :root{
    --bg:#f4f5f9; --surface:#fff; --surface-2:#f1f3f8; --text:#0f172a; --muted:#64748b; --line:#e6e8f0;
    --accent:#4f46e5; --accent-soft:#eef2ff;
    --green:#15803d; --green-soft:#ecfdf3; --red:#e11d48; --red-soft:#fff1f2;
    --amber:#b родителей; --amber-soft:#fffbeb; --blue:#1d4ed8; --blue-soft:#eff6ff;
    --radius:18px;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
    --shadow-lg:0 14px 34px rgba(15,23,42,.14);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d12; --surface:#151821; --surface-2:#1e222d; --text:#e8eaf0; --muted:#8b93a7; --line:#272c39;
      --accent:#818cf8; --accent-soft:#1e1b4b;
      --green:#4ade80; --green-soft:#0f2a1a;
      --red:#fb7185; --red-soft:#2a1218;
      --amber:#fbbf24; --amber-soft:#fffbeb; --blue:#93c5fd; --blue-soft:#14213d;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
      --shadow-lg:0 14px 34px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 "Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-weight:800}
  a{color:var(--accent);text-decoration:none}
  h2{font-size:22px;line-height:1.25;margin:0 0 14px;letter-spacing:-.02em}
  h3{font-size:17px;margin:0 0 10px;letter-spacing:-.01em}

  /* ---------- Шапка ---------- */
  header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;
         padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--surface);
         background:color-mix(in srgb,var(--surface) 82%,transparent);
         backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
         border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:10px;color:var(--text);white-space:nowrap;
        font-family:"Unbounded","Manrope",sans-serif;font-weight:700;font-size:18px;letter-spacing:-.03em}
  .logo em{font-style:normal;background:linear-gradient(135deg,#4f46e5,#a855f7);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  .logo-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;
        background:linear-gradient(135deg,#4f46e5,#a855f7);color:#fff;font-size:17px;font-family:"Manrope",sans-serif;
        font-weight:800;box-shadow:0 4px 12px rgba(99,70,229,.35)}
  @media (prefers-color-scheme:dark){ .logo em{background-image:linear-gradient(135deg,#818cf8,#c084fc)} }
  nav a{color:var(--text);font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--surface-2);
        white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;transition:transform .1s}
  nav a:active{transform:scale(.94)}
  @media (max-width:420px){ .logo{font-size:15px;gap:8px} .logo-icon{width:28px;height:28px;fontинка-size:15px}
    nav{gap:4px} nav a{padding:7px 9px;max-width:90px} }
  @media (max-width:360px){ .logo > span:last-child{display:none} }

  main{max-width:960px;margin:0 auto;padding:16px 16px 110px}
  #app > *{animation:fadeIn .22s ease both}
  @keyframes fadeIn{from{opacity:0}}

  #app > a:first-child:not(.panel){display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
        background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:14px;color:var(--text)}

  /* Загрузка */
  .loading{text-align:center;padding:70px 0;color:var(--muted)}
  .loading::before{content:"";display:block;width:30px;height:30px;margin:0 auto 12px;
        border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Фильтры ---------- */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar select{width:auto;border-radius:999px;padding:9px 36px 9px 14px;font-size:14px;font-weight:600;
        background-color:var(--surface);box-shadow:var(--shadow)}
  @media (max-width:640px){
    .toolbar .btn.primary{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;
        padding:15px 22px;border-radius:999px;font-size:16px;box-shadow:0 12px 30px rgba(79,70,229,.45)}
  }

  /* ---------- Карточки ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  @media (max-width:520px){ .grid{grid-template-columns:1fr 1fr;gap:10px} }
  .empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--muted)}
  .empty::before{content:"📭";display:block;font-size:46px;margin-bottom:6px}

  .card{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--radius);
        overflow:hidden;color:inherit;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .card:active{transform:scale(.98)}
  .card.late{box-shadow:0 0 0 2px var(--red),var(--shadow)}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface-2)}
  .card-body{padding:12px 14px 14px;display:grid;gap:2px}
  .card-body b{font-size:15px;line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;
        -webkit-box-orient:vertical;overflow:hidden}
  .card-body .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .badge{position:absolute;top:10px;left:10px;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.18)}
  @media (max-width:520px){ .card-body{padding:10px 11px 12px} .card-body b{font-size:14px} }

  /* ---------- Статусы ----------
